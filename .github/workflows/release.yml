name: Release

# Builds the Setup wizard and the portable app on Windows and publishes them as
# a GitHub prerelease. Run by hand from the Actions tab (or the API) once the
# release commit is on main and its notes exist in docs/releases/.
#
# The tag is created by the release itself, at the commit this run builds, so
# the published binaries always come from the tagged commit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match tauri.conf.json), e.g. 0.3.3"
        required: true
        type: string
      title:
        description: "Release title after the version, e.g. Faster captures and a responsive UI"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease (developer preview)"
        required: true
        type: boolean
        default: true

# Only this workflow writes: it creates the tag and the release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      NOTES: docs/releases/v${{ inputs.version }}.md
      # Free text from the dispatch form: read from the environment, never
      # spliced into a script.
      TITLE: ${{ inputs.title }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Refuse before spending an hour on a build that can't be published:
      # the version must be the one the app and installer are built with,
      # its notes must exist, and the tag must not.
      - name: Check the release inputs
        run: |
          app=$(node -p "require('./app/backend/src-tauri/tauri.conf.json').version")
          installer=$(node -p "require('./installer/app/backend/src-tauri/tauri.conf.json').version")
          if [ "$app" != "$VERSION" ] || [ "$installer" != "$VERSION" ]; then
            echo "::error::Requested $VERSION, but the app is $app and the installer is $installer"
            exit 1
          fi
          if [ ! -s "$NOTES" ]; then
            echo "::error::Release notes not found at $NOTES"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # pnpm 11 needs Node >= 22.13 (it imports `node:sqlite`).
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            installer/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          workspaces: |
            app/backend
            installer/app/backend

      # The installer is a separate pnpm workspace with its own lockfile.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir installer install --frozen-lockfile

      # App, portable zip, installer payload, then the Setup wizard.
      - name: Build
        run: pnpm dist

      - name: Stage release files
        run: pnpm release:artifacts

      # SHA256SUMS.txt is written with CRLF line endings for Windows users;
      # GNU sha256sum would read the CR as part of each file name.
      - name: Verify checksums
        working-directory: build/release
        run: tr -d '\r' < SHA256SUMS.txt | sha256sum --check --strict -

      - name: Publish the release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            "build/release/Clippity-$VERSION-Setup.exe" \
            "build/release/Clippity-$VERSION-portable.zip" \
            build/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Clippity $VERSION: $TITLE" \
            --notes-file "$NOTES" \
            "${flags[@]}"
