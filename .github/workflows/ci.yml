name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the tree — it publishes nothing and comments nowhere. Setting
# this at the top level makes the read-only default explicit rather than
# inherited from a repository setting that can change underneath the workflow.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (types, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 needs Node >= 22.13 (it imports `node:sqlite`).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check:js

      - name: Lint
        run: pnpm --filter @clippity/shared --filter clippity-frontend lint

      - name: Test
        run: pnpm test:js

  backend:
    name: Backend (clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 needs Node >= 22.13 (it imports `node:sqlite`).
          node-version: 24
          cache: pnpm

      # Third-party actions are pinned to a commit, not a tag or branch:
      # `@stable` is a branch that moves, so an upstream compromise would
      # reach this workflow on the next run with nothing to review.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          workspaces: app/backend

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri-build` validates that `frontendDist` exists, so the web assets
      # have to be built before anything touches the app crate.
      - name: Build frontend assets
        run: pnpm build

      - name: Clippy
        run: pnpm cargo:clippy

      # The first build downloads matching ONNX Runtime binaries through `ort`,
      # so an uncached run is slow.
      - name: Test
        run: pnpm cargo:test
