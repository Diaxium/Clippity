packages:
  - "app/frontend"
  - "app/shared"
  - "app/backend/src-tauri"

# Keep transitive tooling dependencies on security-patched release lines.
overrides:
  "brace-expansion@1": 1.1.18
  "brace-expansion@5": 5.0.9
  fast-uri: 3.1.6
  js-yaml: 4.3.2

# Native postinstall builds are opt-in under pnpm; these two are the only
# dependencies in the graph that need to run their build scripts.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
